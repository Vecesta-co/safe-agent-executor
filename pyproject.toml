[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "safe-agent-executor"
version = "1.0.0"
description = "Guarded ReAct agent execution engine with cycle detection, human-in-the-loop approval gates, and dry-run execution"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0"]

[project.scripts]
safe-agent = "src.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
